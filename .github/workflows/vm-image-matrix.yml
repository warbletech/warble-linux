# Alpine-inspired VM image matrix (additive).
#
# Inspired by alpine-make-vm-image's CI (qcow2/raw formats, BIOS+UEFI, a
# parked aarch64 cell):
#   https://github.com/alpinelinux/alpine-make-vm-image/blob/master/.github/workflows/ci.yml
#
# warble-linux already builds a single partitioned disk that boots both BIOS
# (syslinux MBR) and UEFI (ESP) — see scripts/build-images.sh — and
# images.yml already boot-tests the Vagrant box in QEMU. This workflow does
# not replace those jobs.
#
# What is new:
#   - scripts/build.sh vm <edition> delegates to build-images.sh disk, then
#     scripts/export-vm-formats.sh writes standalone .qcow2 and .raw
#   - A cheap PR job: fixture export (tiny qemu-img box, no pacstrap, no root)
#   - A full build+boot job on workflow_dispatch only, so PRs do not pay for
#     a second pacstrap next to images.yml
#   - aarch64 is dispatch-gated; the tree has no arm64 profiles yet
#
# Action pins match images.yml / real-iso.yml.

name: VM image matrix (Alpine-inspired)

on:
  pull_request:
    paths:
      - "scripts/build.sh"
      - "scripts/build-images.sh"
      - "scripts/export-vm-formats.sh"
      - "scripts/test-export-vm-formats.sh"
      - "scripts/test.sh"
      - ".github/workflows/vm-image-matrix.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build.sh"
      - "scripts/build-images.sh"
      - "scripts/export-vm-formats.sh"
      - "scripts/test-export-vm-formats.sh"
      - "scripts/test.sh"
      - ".github/workflows/vm-image-matrix.yml"
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition (1=minimal 2=developer 3=cloud-native 4=full)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      include-aarch64:
        description: "Run the parked aarch64 job (expected to fail until arm64 profiles exist)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vm-matrix-${{ github.workflow }}-${{ github.ref }}-${{ inputs.edition || '1' }}
  cancel-in-progress: true

env:
  EDITION: ${{ inputs.edition || '1' }}

jobs:
  # Cheap path: no root, no pacstrap. Proves the exporter and shell syntax.
  fixture-export:
    name: fixture export (qcow2 + raw)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: bash -n on vm scripts
        run: |
          bash -n scripts/build.sh
          bash -n scripts/export-vm-formats.sh
          bash -n scripts/test-export-vm-formats.sh

      - name: Export formats from a tiny fixture box
        run: scripts/test-export-vm-formats.sh

  # Full disk build. Opt-in so it does not duplicate images.yml on every PR.
  # Uses the same scripts as images.yml (privileged Arch / --docker).
  build-vm:
    name: build.sh vm
    if: github.event_name == 'workflow_dispatch'
    needs: [fixture-export]
    runs-on: warble-ci
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build VM disk and export qcow2/raw
        run: |
          set -euo pipefail
          # build.sh vm needs root / an Arch environment with pacstrap.
          # On warble-ci this is expected to be available; --docker is the
          # portable fallback used in docs/local-testing.md.
          if command -v pacman >/dev/null && { [[ $EUID -eq 0 ]] || sudo -n true 2>/dev/null; }; then
            sudo scripts/build.sh deps
            sudo VERSION="ci-${{ github.run_number }}" scripts/build.sh vm "$EDITION"
          else
            VERSION="ci-${{ github.run_number }}" scripts/build.sh vm "$EDITION" --docker
          fi
          ls -lh out/
          qemu-img info out/*.qcow2
          qemu-img info out/*.raw

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-ed${{ env.EDITION }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  boot-test:
    name: QEMU ${{ matrix.firmware }}
    if: github.event_name == 'workflow_dispatch'
    needs: [build-vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-ed${{ env.EDITION }}
          path: out

      - name: Install QEMU (+ OVMF) and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf

      - name: Boot smoke test (scripts/test.sh vm)
        run: |
          set -euo pipefail
          box=$(ls out/*-libvirt.box)
          scripts/test.sh vm "$box" "${{ matrix.firmware }}"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-serial-ed${{ env.EDITION }}-${{ matrix.firmware }}
          path: out/logs/
          if-no-files-found: warn
          retention-days: 7

  # Parked. The tree has no aarch64 profiles; enabling this from dispatch is
  # expected to fail until those exist. Default is off so ordinary CI stays green.
  test-aarch64:
    name: aarch64 (parked)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include-aarch64 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No aarch64 profiles yet
        run: |
          echo "warble-linux has no aarch64/arm64 edition profiles yet."
          echo "This job is parked, following alpine-make-vm-image's aarch64 cell."
          exit 1
