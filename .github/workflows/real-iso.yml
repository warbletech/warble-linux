name: Real ISO build + boot

# Builds a REAL bootable ISO (edition 1, minimal) with mkarchiso in a privileged
# Arch container, then boots it headless in QEMU (BIOS and UEFI) and waits for a
# login prompt on the serial console. Fails on mock output or a failed boot.
# GitHub-hosted runners only. Read-only token except the provenance step.
#
# Also a reusable workflow: release.yml calls it (workflow_call) per edition so a
# release only ever publishes ISOs that were really built AND boot-tested.
# Job names stay "mkarchiso edition N" / "boot smoke test (bios|uefi)" — they are
# required status checks on main; rename only together with branch protection.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build (1=minimal 2=developer 3=cloud-native 4=full)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
  workflow_call:
    inputs:
      edition:
        description: "Edition to build (1-4)"
        type: string
        default: "1"
      version:
        description: "Version string for artifact names (default ci-<run_number>)"
        type: string
        default: ""
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded ISO artifact"
        type: string
        default: "real-iso"

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so release runs
  # (one call per edition) never cancel each other or PR runs.
  group: real-iso-${{ github.workflow }}-${{ github.ref }}-${{ inputs.edition || '1' }}
  cancel-in-progress: true

jobs:
  build:
    name: mkarchiso edition ${{ inputs.edition || '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write       # provenance attestation (push to main only)
      attestations: write
    container:
      image: archlinux:base-20261004.0.606936
      options: --privileged
    env:
      EDITION: ${{ inputs.edition || '1' }}
      ARTIFACT_NAME: ${{ inputs.artifact-name || 'real-iso' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git (for checkout)
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install build tools (scripts/build.sh deps)
        run: scripts/build.sh deps

      - name: Validate firewall ruleset
        run: nft -c -f profile/airootfs/etc/nftables.conf

      - name: Build real ISO (scripts/build.sh iso)
        env:
          VERSION: ${{ inputs.version || format('ci-{0}', github.run_number) }}
          WORK_DIR: /tmp/warble-linux-work
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          df -h / /tmp
          scripts/build.sh iso "$EDITION"
          df -h / /tmp

      - name: Verify ISO (scripts/test.sh iso-verify)
        run: |
          set -euo pipefail
          iso=$(find out -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
          scripts/test.sh iso-verify "$iso"
          (cd out && sha256sum "$(basename "$iso")" > SHA256SUMS-real-iso.txt && cat SHA256SUMS-real-iso.txt)

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/*.iso
            out/MANIFEST-*.txt
            out/SHA256SUMS-real-iso.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.iso

  boot:
    name: boot smoke test (${{ matrix.firmware }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || 'real-iso' }}
          path: out

      - name: Verify checksum
        run: cd out && sha256sum -c SHA256SUMS-real-iso.txt

      - name: Install QEMU (+ OVMF) and enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot headless to login prompt (scripts/test.sh iso)
        env:
          FIRMWARE: ${{ matrix.firmware }}
          OK_DIR: ok
          LOG_DIR: logs
        run: |
          iso=$(find out -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
          scripts/test.sh iso "$iso" "$FIRMWARE"

      - name: Upload boot-success marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootok-${{ inputs.artifact-name || 'real-iso' }}-${{ matrix.firmware }}
          path: ok/boot-ok-*.txt
          retention-days: 5

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-log-${{ inputs.edition || '1' }}-${{ matrix.firmware }}
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7
