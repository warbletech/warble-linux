name: Real ISO build + boot

# Builds a REAL bootable ISO (edition 1, minimal) with mkarchiso in a privileged
# Arch container, then boots it headless in QEMU (BIOS and UEFI) and waits for a
# login prompt on the serial console. Fails on mock output or a failed boot.
# GitHub-hosted runners only. Read-only token except the provenance step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build (1=minimal 2=developer 3=cloud-native 4=full)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: warble-linux-real-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkarchiso edition ${{ github.event.inputs.edition || '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write       # provenance attestation (push to main only)
      attestations: write
    container:
      image: archlinux:base-20261004.0.606936
      options: --privileged
    env:
      EDITION: ${{ github.event.inputs.edition || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            archiso grub mtools dosfstools libisoburn squashfs-tools nftables \
            mkinitcpio git make which tar gzip

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate firewall ruleset
        run: nft -c -f profile/airootfs/etc/nftables.conf

      - name: Bake real ISO (no mock allowed)
        env:
          REQUIRE_REAL: "1"
          MOCK_ONLY: "0"
          VERSION: ci-${{ github.run_number }}
          WORK_DIR: /tmp/warble-linux-work
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export GIT_SHA="${GITHUB_SHA::7}"
          make bake EDITION="$EDITION"
          ls -la out/

      - name: Verify the ISO is real and has the archiso initramfs hook
        run: |
          set -euo pipefail
          iso=$(find out -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
          man=$(find out -maxdepth 1 -name 'MANIFEST-*.txt' | head -1)
          test -n "$iso" && test -n "$man"
          cat "$man"
          grep -qx 'mock=no' "$man" || { echo "::error::MANIFEST does not say mock=no"; exit 1; }
          size=$(stat -c%s "$iso")
          echo "ISO size: $size bytes"
          (( size > 200 * 1024 * 1024 )) || { echo "::error::ISO too small to be real ($size bytes)"; exit 1; }
          xorriso -indev "$iso" -ls /arch/boot/x86_64/ 2>/dev/null | tee /tmp/bootfiles.txt
          grep -q vmlinuz-linux /tmp/bootfiles.txt
          grep -q initramfs-linux.img /tmp/bootfiles.txt
          xorriso -osirrox on -indev "$iso" -extract /arch/boot/x86_64/initramfs-linux.img /tmp/initramfs.img >/dev/null 2>&1
          lsinitcpio /tmp/initramfs.img | grep -E '^hooks/archiso$' \
            || { echo "::error::initramfs lacks the archiso hook (image would not boot)"; exit 1; }
          (cd out && sha256sum "$(basename "$iso")" > SHA256SUMS-real-iso.txt && cat SHA256SUMS-real-iso.txt)

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-iso
          path: |
            out/*.iso
            out/MANIFEST-*.txt
            out/SHA256SUMS-real-iso.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.iso

  boot:
    name: boot smoke test (${{ matrix.firmware }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - name: Download ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: real-iso
          path: out

      - name: Verify checksum
        run: cd out && sha256sum -c SHA256SUMS-real-iso.txt

      - name: Install QEMU (+ OVMF) and enable KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot headless and wait for login prompt
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -euo pipefail
          iso=$(find out -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
          accel=tcg; limit=1200
          if [[ -w /dev/kvm ]]; then accel=kvm; limit=600; fi
          fw=()
          if [[ "$FIRMWARE" == "uefi" ]]; then
            code=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
            vars_src=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
            cp "$vars_src" /tmp/ovmf_vars.fd
            fw=(-drive "if=pflash,format=raw,readonly=on,file=$code" -drive "if=pflash,format=raw,file=/tmp/ovmf_vars.fd")
          fi
          echo "accel=$accel firmware=$FIRMWARE timeout=${limit}s iso=$iso"
          # Disposable sandbox: no disk, -snapshot, user-mode NIC; destroyed by kill.
          qemu-system-x86_64 -accel "$accel" -m 2048 -smp 2 "${fw[@]}" \
            -cdrom "$iso" -boot d -snapshot -nic user,model=virtio-net-pci \
            -display none -monitor none -serial file:serial.log &
          qpid=$!
          result=timeout
          for ((t = 0; t < limit; t += 5)); do
            sleep 5
            if grep -qE 'Kernel panic|emergency shell|You are now being dropped|ERROR: .*device did not show up' serial.log 2>/dev/null; then
              result=failed; break
            fi
            if grep -qE 'login:' serial.log 2>/dev/null; then
              result=ok; break
            fi
            kill -0 "$qpid" 2>/dev/null || { result=exited; break; }
          done
          kill "$qpid" 2>/dev/null || true   # tear down the sandbox
          wait "$qpid" 2>/dev/null || true
          echo "----- serial console (tail) -----"
          tail -n 60 serial.log || true
          echo "boot result: $result after ~${t}s"
          [[ "$result" == ok ]]

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-log-${{ matrix.firmware }}
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7
