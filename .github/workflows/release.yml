name: Release

# build -> test -> publish. Publishes REAL, tested artifacts only; never mock/stubs.
# Stages call the same scripts as a local run (docs/local-testing.md):
#   build: scripts/build.sh iso|images   test: scripts/test.sh   publish: scripts/publish.sh
#
#   1. prepare  : resolve version/tag (tag push vX.Y.Z must match VERSION)
#   2. real     : reusable real-iso.yml per edition — mkarchiso in a privileged
#                 Arch container (REQUIRE_REAL=1), then QEMU BIOS + UEFI boot
#                 test to a serial login prompt
#   3. publish  : verify mock=no + size < 2 GiB + checksums, attest provenance,
#                 upload ISO + MANIFEST + SHA256SUMS to the GitHub Release
#
# Triggers:
#   - push tag vX.Y.Z (stable, Latest) or vX.Y.Z-rc.N (prerelease)
#   - workflow_dispatch with dry_run=true (default) from any branch: builds,
#     boot-tests and uploads to a DRAFT release named dryrun-<run_id>; nothing
#     is tagged. Delete the draft afterwards.
# Version bumps happen in a PR (make bump-minor); main is protected.
# GitHub-hosted ubuntu-24.04 only.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: publish to a DRAFT release (no tag)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: warble-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version & tag
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.prep.outputs.semver }}
      tag: ${{ steps.prep.outputs.tag }}
      artifact_version: ${{ steps.prep.outputs.artifact_version }}
      draft: ${{ steps.prep.outputs.draft }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      sha: ${{ steps.prep.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: prep
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/version.sh
          FILE_SEMVER=$(./scripts/version.sh print | tr -d '\n')
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              SEMVER="${BASH_REMATCH[1]}"
              PRE="${BASH_REMATCH[2]}"
            else
              echo "::error::tag must be vX.Y.Z or vX.Y.Z-prerelease (got $TAG)"; exit 1
            fi
            if [[ "$SEMVER" != "$FILE_SEMVER" ]]; then
              echo "::error::tag $TAG does not match VERSION file ($FILE_SEMVER); bump VERSION via PR first"; exit 1
            fi
            ARTIFACT_VERSION="${TAG#v}"
            DRAFT=false
            if [[ -n "$PRE" ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "::error::non-dry-run releases are created by pushing a vX.Y.Z tag"; exit 1
            fi
            SEMVER="$FILE_SEMVER"
            TAG="dryrun-${RUN_ID}"
            ARTIFACT_VERSION="${FILE_SEMVER}-dryrun.${RUN_ID}"
            DRAFT=true
            PRERELEASE=true
          fi
          {
            echo "semver=$SEMVER"
            echo "tag=$TAG"
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "draft=$DRAFT"
            echo "prerelease=$PRERELEASE"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG artifact_version=$ARTIFACT_VERSION draft=$DRAFT prerelease=$PRERELEASE"
        shell: bash

  real:
    name: real ISO edition ${{ matrix.edition }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Every edition is built and boot-tested; publish uploads only the
        # editions whose build AND both boot tests passed (see docs/releases.md).
        edition: ["1", "2", "3", "4"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/real-iso.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.artifact_version }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-name: release-iso-${{ matrix.edition }}

  images:
    name: images edition ${{ matrix.edition }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        edition: ["1", "2", "3", "4"]
    uses: ./.github/workflows/images.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.artifact_version }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-prefix: release

  publish:
    name: GitHub Release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, real, images]
    # Run even if some editions failed: only passing editions are published.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download built ISOs (build stage)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/iso
          pattern: release-iso-*

      - name: Download WSL / Vagrant / OVA images (build stage)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/images
          pattern: images-release-*
          merge-multiple: true

      - name: Download test markers (test stage)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ok
          pattern: "*ok-release-*"
          merge-multiple: true

      - name: Assemble tested assets + notes (scripts/publish.sh, dry run)
        env:
          AV: ${{ needs.prepare.outputs.artifact_version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la ok || true
          scripts/publish.sh --dist dist --ok ok --version "$AV" --tag "$TAG" \
            --assets "$GITHUB_WORKSPACE/release-assets"
          cat release-body.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every published file (ISOs, MANIFESTs, tested WSL/Vagrant/OVA images)
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Warble Linux ${{ needs.prepare.outputs.tag }}"
          body_path: release-body.md
          files: release-assets/*
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.draft != 'true' && needs.prepare.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
