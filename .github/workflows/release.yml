name: Release

# Publishes REAL, boot-tested ISOs only. Mock artifacts are never published here.
#
#   1. prepare  : resolve version/tag (tag push vX.Y.Z must match VERSION)
#   2. real     : reusable real-iso.yml per edition — mkarchiso in a privileged
#                 Arch container (REQUIRE_REAL=1), then QEMU BIOS + UEFI boot
#                 test to a serial login prompt
#   3. publish  : verify mock=no + size < 2 GiB + checksums, attest provenance,
#                 upload ISO + MANIFEST + SHA256SUMS to the GitHub Release
#
# Triggers:
#   - push tag vX.Y.Z (stable, Latest) or vX.Y.Z-rc.N (prerelease)
#   - workflow_dispatch with dry_run=true (default) from any branch: builds,
#     boot-tests and uploads to a DRAFT release named dryrun-<run_id>; nothing
#     is tagged. Delete the draft afterwards.
# Version bumps happen in a PR (make bump-minor); main is protected.
# GitHub-hosted ubuntu-24.04 only.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: publish to a DRAFT release (no tag)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: warble-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version & tag
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.prep.outputs.semver }}
      tag: ${{ steps.prep.outputs.tag }}
      artifact_version: ${{ steps.prep.outputs.artifact_version }}
      draft: ${{ steps.prep.outputs.draft }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      sha: ${{ steps.prep.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: prep
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/version.sh
          FILE_SEMVER=$(./scripts/version.sh print | tr -d '\n')
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              SEMVER="${BASH_REMATCH[1]}"
              PRE="${BASH_REMATCH[2]}"
            else
              echo "::error::tag must be vX.Y.Z or vX.Y.Z-prerelease (got $TAG)"; exit 1
            fi
            if [[ "$SEMVER" != "$FILE_SEMVER" ]]; then
              echo "::error::tag $TAG does not match VERSION file ($FILE_SEMVER); bump VERSION via PR first"; exit 1
            fi
            ARTIFACT_VERSION="${TAG#v}"
            DRAFT=false
            if [[ -n "$PRE" ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "::error::non-dry-run releases are created by pushing a vX.Y.Z tag"; exit 1
            fi
            SEMVER="$FILE_SEMVER"
            TAG="dryrun-${RUN_ID}"
            ARTIFACT_VERSION="${FILE_SEMVER}-dryrun.${RUN_ID}"
            DRAFT=true
            PRERELEASE=true
          fi
          {
            echo "semver=$SEMVER"
            echo "tag=$TAG"
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "draft=$DRAFT"
            echo "prerelease=$PRERELEASE"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG artifact_version=$ARTIFACT_VERSION draft=$DRAFT prerelease=$PRERELEASE"
        shell: bash

  real:
    name: real ISO edition ${{ matrix.edition }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Every edition is built and boot-tested; publish uploads only the
        # editions whose build AND both boot tests passed (see docs/releases.md).
        edition: ["1", "2", "3", "4"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/real-iso.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.artifact_version }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-name: release-iso-${{ matrix.edition }}

  images:
    name: images edition ${{ matrix.edition }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        edition: ["1", "2", "3", "4"]
    uses: ./.github/workflows/images.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.artifact_version }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-prefix: release

  publish:
    name: GitHub Release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, real, images]
    # Run even if some editions failed: only passing editions are published.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download built ISOs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          pattern: release-iso-*

      - name: Download boot-success markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ok
          pattern: bootok-release-iso-*
          merge-multiple: true

      - name: Download WSL / Vagrant / OVA images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: img
          pattern: images-release-*
          merge-multiple: true

      - name: Download image test markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ok
          pattern: imgok-release-*
          merge-multiple: true

      - name: Verify (real only, < 2 GiB, checksums) and assemble assets
        env:
          AV: ${{ needs.prepare.outputs.artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # One artifact downloads flat into dl/, several into dl/<name>/:
          # locate each edition's directory via its MANIFEST.
          mapfile -t mans < <(find dl -name 'MANIFEST-*.txt' | sort)
          (( ${#mans[@]} > 0 )) || { echo "::error::no MANIFEST found in downloaded artifacts"; find dl; exit 1; }
          : > skipped.txt
          for m in "${mans[@]}"; do
            d=$(dirname "$m")
            ed=$(sed -n 's/^edition=.*(\([0-9]\)).*/\1/p' "$m")
            if [[ ! -f "ok/boot-ok-${ed}-bios.txt" || ! -f "ok/boot-ok-${ed}-uefi.txt" ]]; then
              echo "::warning::edition ${ed}: boot test did not pass on BIOS and UEFI — not publishing"
              echo "$ed" >> skipped.txt
              continue
            fi
            (cd "$d" && sha256sum -c SHA256SUMS-real-iso.txt)
            man=$(find "$d" -maxdepth 1 -name 'MANIFEST-*.txt' | head -1)
            iso=$(find "$d" -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
            [[ -n "$man" && -n "$iso" ]] || { echo "::error::missing ISO or MANIFEST in $d"; exit 1; }
            grep -qx 'mock=no' "$man" || { echo "::error::$man is not mock=no — refusing to publish"; exit 1; }
            size=$(stat -c%s "$iso")
            (( size < 2 * 1024 * 1024 * 1024 )) || { echo "::error::$(basename "$iso") is $size bytes (GitHub limit 2 GiB)"; exit 1; }
            echo "$(basename "$iso"): $size bytes"
            cp "$iso" "$man" release-assets/
            echo "$ed" >> published.txt
          done
          touch published.txt
          for e in 1 2 3 4; do
            grep -qx "$e" published.txt || grep -qx "$e" skipped.txt || echo "$e" >> skipped.txt   # build failed: no artifact
          done
          compgen -G 'release-assets/*.iso' >/dev/null || { echo "::error::no edition passed build + boot — nothing to publish"; exit 1; }

          # WSL / Vagrant / OVA: publish an image only if its CI test passed.
          : > images-published.txt; : > images-skipped.txt
          names=([1]=minimal [2]=developer [3]=cloud-native [4]=full)
          if compgen -G 'img/SHA256SUMS-images-*.txt' >/dev/null; then
            (cd img && cat SHA256SUMS-images-*.txt | sha256sum -c)
          fi
          for e in 1 2 3 4; do
            n=${names[$e]}
            wsl="img/warble-linux-wsl2-${n}-${AV}.tar.gz"
            if [[ -f "ok/img-ok-${e}-wsl.txt" && -f "$wsl" ]]; then
              cp "$wsl" release-assets/; echo "$(basename "$wsl")" >> images-published.txt
            else
              echo "${n}: WSL" >> images-skipped.txt
            fi
            box="img/warble-linux-${n}-${AV}-libvirt.box"; ova="img/warble-linux-${n}-${AV}.ova"
            if [[ -f "ok/img-ok-${e}-vm-bios.txt" && -f "ok/img-ok-${e}-vm-uefi.txt" && -f "$box" && -f "$ova" ]]; then
              cp "$box" "$ova" release-assets/; basename -a "$box" "$ova" >> images-published.txt
            else
              echo "${n}: Vagrant/OVA" >> images-skipped.txt
            fi
          done
          for f in release-assets/*; do
            (( $(stat -c%s "$f") < 2 * 1024 * 1024 * 1024 )) || { echo "::error::$f exceeds 2 GiB"; exit 1; }
          done
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la release-assets/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every published file (ISOs, MANIFESTs, tested WSL/Vagrant/OVA images)
          subject-checksums: release-assets/SHA256SUMS.txt

      - name: Write release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          AV: ${{ needs.prepare.outputs.artifact_version }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Warble Linux ${TAG}"
            echo ""
            echo "Real live ISO(s) built with \`mkarchiso\` and **boot-tested in CI** (QEMU, BIOS + UEFI, serial login prompt) before upload."
            echo ""
            echo "| Edition | Asset |"
            echo "|---------|-------|"
            for f in release-assets/*.iso; do
              b=$(basename "$f"); e=$(echo "$b" | sed -E "s/^warble-linux-(.*)-${AV}-.*/\1/")
              echo "| ${e} | \`${b}\` ($(( $(stat -c%s "$f") / 1024 / 1024 )) MiB) |"
            done
            echo ""
            echo "Only editions that built **and** booted on BIOS and UEFI are published."
            if [[ -s images-published.txt ]]; then
              echo ""
              echo "### WSL2 / Vagrant / OVA images (tested in CI)"
              echo "WSL rootfs: tar checks + \`docker import\` smoke test. Vagrant box: booted in QEMU (BIOS + UEFI) and reached over SSH as \`vagrant\`. OVA: same disk as the box; structure/checksums verified, **not** boot-tested in VirtualBox."
              echo ""
              sed 's/^/- `/; s/$/`/' images-published.txt
            fi
            if [[ -s images-skipped.txt ]]; then
              echo ""
              echo "Images not published this time (build or test failed): $(paste -sd, images-skipped.txt)"
            fi
            if [[ -s skipped.txt ]]; then
              echo "Not published this time (failed build or boot): edition(s) $(sort -u skipped.txt | tr '\n' ' ')"
            fi
            echo ""
            echo "### Verify"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify warble-linux-*.iso -R ${REPO}"
            echo '```'
            echo ""
            echo "### Disposable sandbox"
            echo '```bash'
            echo "# ISO (live, nothing persists): create/use, then quit QEMU to destroy"
            echo "qemu-system-x86_64 -enable-kvm -m 2048 -cdrom warble-linux-minimal-${AV}-*.iso -boot d -snapshot -nic user"
            echo ""
            echo "# WSL2 (PowerShell): create, use, destroy"
            echo "wsl --import warble-sbx \$env:LOCALAPPDATA\\warble-sbx .\\warble-linux-wsl2-minimal-${AV}.tar.gz --version 2"
            echo "wsl -d warble-sbx"
            echo "wsl --unregister warble-sbx"
            echo ""
            echo "# Vagrant (libvirt): create, use, destroy"
            echo "vagrant box add --name warble/minimal warble-linux-minimal-${AV}-libvirt.box"
            echo "vagrant init warble/minimal && vagrant up --provider=libvirt && vagrant ssh"
            echo "vagrant destroy -f && vagrant box remove warble/minimal"
            echo '```'
            if [[ -f CHANGELOG.md ]]; then
              echo ""
              echo "### Changelog"
              echo ""
              awk -v ver="$SEMVER" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && $0 ~ /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md || true
            fi
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Warble Linux ${{ needs.prepare.outputs.tag }}"
          body_path: release-body.md
          files: release-assets/*
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.draft != 'true' && needs.prepare.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
