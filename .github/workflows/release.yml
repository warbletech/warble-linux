name: Release

# Stable semver releases: tag vX.Y.Z or dispatch with bump/set.
# GitHub-hosted ubuntu-latest only.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump VERSION then tag (ignored if version is set)"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Exact semver X.Y.Z (optional; overrides bump when set)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false

# Least privilege: read-only by default; write only on the jobs that publish.
permissions:
  contents: read

concurrency:
  group: warble-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write       # dispatch path commits VERSION and pushes the tag
    outputs:
      semver: ${{ steps.prep.outputs.semver }}
      tag: ${{ steps.prep.outputs.tag }}
      artifact_version: ${{ steps.prep.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: prep
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump || 'none' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/version.sh

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v* ]]; then
            # Tag push: v1.2.3 or v1.2.3-rc.1 → strip leading v for VERSION file style base
            TAG="$REF_NAME"
            # Stable X.Y.Z only for VERSION file; keep full tag for release
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              SEMVER="${BASH_REMATCH[1]}"
              echo "$SEMVER" > VERSION
            elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-.+)$ ]]; then
              SEMVER="${BASH_REMATCH[1]}"
            else
              echo "error: tag must be vX.Y.Z or vX.Y.Z-prerelease" >&2
              exit 1
            fi
            ARTIFACT_VERSION="${TAG#v}"
          else
            # workflow_dispatch
            if [[ -n "$INPUT_VERSION" ]]; then
              ./scripts/version.sh set "$INPUT_VERSION"
            elif [[ "$INPUT_BUMP" != "none" ]]; then
              ./scripts/version.sh bump "$INPUT_BUMP"
            fi
            SEMVER=$(./scripts/version.sh print | tr -d '\n')
            TAG="v${SEMVER}"
            ARTIFACT_VERSION="$SEMVER"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): ${TAG}"
              git push origin HEAD:main
            fi
            # Create annotated tag if missing
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — releasing that ref"
            else
              git tag -a "$TAG" -m "Release ${TAG}"
              git push origin "$TAG"
            fi
          fi

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG artifact_version=$ARTIFACT_VERSION"

  bake:
    name: edition ${{ matrix.edition }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [1, 2, 3, 4]
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage xorriso make || true

      - name: Make and bake
        env:
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ needs.prepare.outputs.artifact_version }}
          # GIT_SHA left unset: make-and-bake uses the checked-out tag's commit
          MOCK_ONLY: "0"
        run: |
          chmod +x scripts/*.sh make-and-bake.sh
          make bake EDITION="${{ matrix.edition }}"
          ls -la out/
          find out -type f -size 0 -print -exec false {} +

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-edition-${{ matrix.edition }}-${{ needs.prepare.outputs.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  test-matrix:
    name: test all artifacts
    needs: [prepare, bake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: release-edition-*
          merge-multiple: true
      - run: |
          chmod +x scripts/test-artifacts.sh
          OUT_DIR="$PWD/out" ./scripts/test-artifacts.sh

  publish:
    name: GitHub Release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, bake, test-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: release-edition-*
          merge-multiple: true

      - name: Guard non-empty assets
        run: |
          find release-assets -type f | sort
          find release-assets -type f -size 0 -print -exec false {} +

      - name: Detect mock artifacts
        id: kind
        run: |
          # Never present mock artifacts as a real release: label them, keep them
          # out of "Latest", and mark the release as a prerelease.
          if grep -l '^mock=yes' release-assets/MANIFEST-*.txt >/dev/null 2>&1; then
            echo "mock=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release assets are MOCK (not bootable); publishing as labeled prerelease"
          else
            echo "mock=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        env:
          IS_MOCK: ${{ steps.kind.outputs.mock }}
        run: |
          {
            echo "## Warble Linux ${{ needs.prepare.outputs.tag }}"
            echo ""
            if [[ "$IS_MOCK" == "true" ]]; then
              echo "> [!WARNING]"
              echo "> **MOCK artifacts — not bootable.** These assets were produced without mkarchiso."
              echo "> Use the ISO from the \"Real ISO build + boot\" workflow for an actual sandbox."
              echo ""
            fi
            echo "Semver **${{ needs.prepare.outputs.artifact_version }}** · editions 1–4"
            echo ""
            echo "| Artifact | Description |"
            echo "|----------|-------------|"
            echo "| \`*.iso\` | Live image (mock on Ubuntu CI without mkarchiso) |"
            echo "| \`*-wsl2-*.tar.gz\` | WSL-style rootfs tarball |"
            echo "| \`*.ovf\` / \`*.box\` | OVF stub / Vagrant box stub |"
            echo "| \`MANIFEST-*\` / \`SHA256SUMS-*\` | Build metadata + checksums |"
            echo ""
            echo "Verify:"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS-full-${{ needs.prepare.outputs.artifact_version }}.txt"
            echo "gh attestation verify <file> -R ${{ github.repository }}"
            echo '```'
            echo ""
            echo "Rebuild: \`VERSION=${{ needs.prepare.outputs.artifact_version }} make release-check\`"
            if [[ -f CHANGELOG.md ]]; then
              echo ""
              echo "### Changelog"
              echo ""
              # Extract section for this version if present
              awk -v ver="${{ needs.prepare.outputs.semver }}" '
                $0 ~ "^## \\[" ver "\\]" {p=1; print; next}
                p && $0 ~ /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md || true
            fi
          } > release-body.md
          cat release-body.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Warble Linux ${{ needs.prepare.outputs.tag }}${{ steps.kind.outputs.mock == 'true' && ' (MOCK, not bootable)' || '' }}"
          body_path: release-body.md
          files: release-assets/*
          prerelease: ${{ steps.kind.outputs.mock == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: ${{ steps.kind.outputs.mock != 'true' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
