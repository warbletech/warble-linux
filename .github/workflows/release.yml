name: Release

# Publishes REAL, boot-tested ISOs only. Mock artifacts are never published here.
#
#   1. prepare  : resolve version/tag (tag push vX.Y.Z must match VERSION)
#   2. real     : reusable real-iso.yml per edition — mkarchiso in a privileged
#                 Arch container (REQUIRE_REAL=1), then QEMU BIOS + UEFI boot
#                 test to a serial login prompt
#   3. publish  : verify mock=no + size < 2 GiB + checksums, attest provenance,
#                 upload ISO + MANIFEST + SHA256SUMS to the GitHub Release
#
# Triggers:
#   - push tag vX.Y.Z (stable, Latest) or vX.Y.Z-rc.N (prerelease)
#   - workflow_dispatch with dry_run=true (default) from any branch: builds,
#     boot-tests and uploads to a DRAFT release named dryrun-<run_id>; nothing
#     is tagged. Delete the draft afterwards.
# Version bumps happen in a PR (make bump-minor); main is protected.
# GitHub-hosted ubuntu-24.04 only.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: publish to a DRAFT release (no tag)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: warble-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare version & tag
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.prep.outputs.semver }}
      tag: ${{ steps.prep.outputs.tag }}
      artifact_version: ${{ steps.prep.outputs.artifact_version }}
      draft: ${{ steps.prep.outputs.draft }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      sha: ${{ steps.prep.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: prep
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/version.sh
          FILE_SEMVER=$(./scripts/version.sh print | tr -d '\n')
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              SEMVER="${BASH_REMATCH[1]}"
              PRE="${BASH_REMATCH[2]}"
            else
              echo "::error::tag must be vX.Y.Z or vX.Y.Z-prerelease (got $TAG)"; exit 1
            fi
            if [[ "$SEMVER" != "$FILE_SEMVER" ]]; then
              echo "::error::tag $TAG does not match VERSION file ($FILE_SEMVER); bump VERSION via PR first"; exit 1
            fi
            ARTIFACT_VERSION="${TAG#v}"
            DRAFT=false
            if [[ -n "$PRE" ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "::error::non-dry-run releases are created by pushing a vX.Y.Z tag"; exit 1
            fi
            SEMVER="$FILE_SEMVER"
            TAG="dryrun-${RUN_ID}"
            ARTIFACT_VERSION="${FILE_SEMVER}-dryrun.${RUN_ID}"
            DRAFT=true
            PRERELEASE=true
          fi
          {
            echo "semver=$SEMVER"
            echo "tag=$TAG"
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "draft=$DRAFT"
            echo "prerelease=$PRERELEASE"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG artifact_version=$ARTIFACT_VERSION draft=$DRAFT prerelease=$PRERELEASE"
        shell: bash

  real:
    name: real ISO edition ${{ matrix.edition }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Editions published as real, boot-tested ISOs. Add an edition only after
        # it builds, stays < 2 GiB and boots in CI (see docs/releases.md).
        edition: ["1"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/real-iso.yml
    with:
      edition: ${{ matrix.edition }}
      version: ${{ needs.prepare.outputs.artifact_version }}
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-name: release-iso-${{ matrix.edition }}

  publish:
    name: GitHub Release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, real]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download boot-tested ISOs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          pattern: release-iso-*

      - name: Verify (real only, < 2 GiB, checksums) and assemble assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # One artifact downloads flat into dl/, several into dl/<name>/:
          # locate each edition's directory via its MANIFEST.
          mapfile -t mans < <(find dl -name 'MANIFEST-*.txt' | sort)
          (( ${#mans[@]} > 0 )) || { echo "::error::no MANIFEST found in downloaded artifacts"; find dl; exit 1; }
          for m in "${mans[@]}"; do
            d=$(dirname "$m")
            (cd "$d" && sha256sum -c SHA256SUMS-real-iso.txt)
            man=$(find "$d" -maxdepth 1 -name 'MANIFEST-*.txt' | head -1)
            iso=$(find "$d" -maxdepth 1 -name 'warble-linux-*.iso' | head -1)
            [[ -n "$man" && -n "$iso" ]] || { echo "::error::missing ISO or MANIFEST in $d"; exit 1; }
            grep -qx 'mock=no' "$man" || { echo "::error::$man is not mock=no — refusing to publish"; exit 1; }
            size=$(stat -c%s "$iso")
            (( size < 2 * 1024 * 1024 * 1024 )) || { echo "::error::$(basename "$iso") is $size bytes (GitHub limit 2 GiB)"; exit 1; }
            echo "$(basename "$iso"): $size bytes"
            cp "$iso" "$man" release-assets/
          done
          (cd release-assets && sha256sum -- *.iso MANIFEST-*.txt > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la release-assets/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.iso
            release-assets/SHA256SUMS.txt

      - name: Write release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          AV: ${{ needs.prepare.outputs.artifact_version }}
          SEMVER: ${{ needs.prepare.outputs.semver }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Warble Linux ${TAG}"
            echo ""
            echo "Real live ISO(s) built with \`mkarchiso\` and **boot-tested in CI** (QEMU, BIOS + UEFI, serial login prompt) before upload."
            echo ""
            echo "| Edition | Asset |"
            echo "|---------|-------|"
            for f in release-assets/*.iso; do
              b=$(basename "$f"); e=$(echo "$b" | sed -E "s/^warble-linux-(.*)-${AV}-.*/\1/")
              echo "| ${e} | \`${b}\` ($(( $(stat -c%s "$f") / 1024 / 1024 )) MiB) |"
            done
            echo ""
            echo "Only the editions listed above are published as real ISOs. WSL / OVF / Vagrant outputs are still stubs and are **not** included."
            echo ""
            echo "### Verify"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify warble-linux-*.iso -R ${REPO}"
            echo '```'
            echo ""
            echo "### Disposable sandbox"
            echo '```bash'
            echo "qemu-system-x86_64 -enable-kvm -m 2048 -cdrom warble-linux-minimal-${AV}-*.iso -boot d -snapshot -nic user"
            echo '```'
            if [[ -f CHANGELOG.md ]]; then
              echo ""
              echo "### Changelog"
              echo ""
              awk -v ver="$SEMVER" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && $0 ~ /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md || true
            fi
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Warble Linux ${{ needs.prepare.outputs.tag }}"
          body_path: release-body.md
          files: release-assets/*
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.draft != 'true' && needs.prepare.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
