name: Build & nightly

# GitHub-hosted public runners only (ubuntu-24.04, pinned). No self-hosted runners.
# Nightly prereleases use semver: vX.Y.Z-nightly.N (from VERSION file).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; write only on the jobs that publish.
permissions:
  contents: read

concurrency:
  group: warble-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      nightly_tag: ${{ steps.v.outputs.nightly_tag }}
      artifact_version: ${{ steps.v.outputs.artifact_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          chmod +x scripts/version.sh
          SEMVER=$(./scripts/version.sh print | tr -d '\n')
          NIGHTLY_TAG=$(./scripts/version.sh nightly "${{ github.run_number }}")
          # Filename-safe: 0.2.0-nightly.12 (no leading v)
          ARTIFACT_VERSION="${SEMVER}-nightly.${{ github.run_number }}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER nightly_tag=$NIGHTLY_TAG artifact=$ARTIFACT_VERSION"

  bake:
    name: edition ${{ matrix.edition }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage xorriso make || true

      - name: Make and bake
        env:
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ needs.version.outputs.artifact_version }}
          GIT_SHA: ${{ github.sha }}
          MOCK_ONLY: "0"
        run: |
          chmod +x scripts/*.sh make-and-bake.sh
          make bake EDITION="${{ matrix.edition }}"
          ls -la out/
          find out -type f -size 0 -print -exec false {} + || {
            echo "Empty files in out/ — aborting"
            find out -type f -exec ls -la {} \;
            exit 1
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warble-linux-edition-${{ matrix.edition }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  test-matrix:
    name: test all artifacts
    needs: [version, bake]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all edition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: warble-linux-edition-*
          merge-multiple: true

      - name: Run artifact tests
        run: |
          chmod +x scripts/test-artifacts.sh
          ls -la out/
          OUT_DIR="$PWD/out" ./scripts/test-artifacts.sh

  nightly:
    name: semver nightly prerelease
    needs: [version, bake, test-matrix]
    # Mock nightlies are retired. Stable packages are ghcr.io via package.yml.
    if: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the prerelease
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all edition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: warble-linux-edition-*
          merge-multiple: true

      - name: Guard non-empty assets
        run: |
          find release-assets -type f | sort
          find release-assets -type f -size 0 -print -exec false {} +

      - name: Label mock artifacts
        id: kind
        run: |
          if grep -l '^mock=yes' release-assets/MANIFEST-*.txt >/dev/null 2>&1; then
            echo "label= (MOCK artifacts, not bootable)" >> "$GITHUB_OUTPUT"
          else
            echo "label=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create semver prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.nightly_tag }}
          name: "v${{ needs.version.outputs.semver }} nightly #${{ github.run_number }}${{ steps.kind.outputs.label }}"
          body: |
            ## Warble Linux `${{ needs.version.outputs.nightly_tag }}`

            Automated **prerelease** from `main` (semver base **${{ needs.version.outputs.semver }}**).

            | | |
            |--|--|
            | **Tag** | `${{ needs.version.outputs.nightly_tag }}` |
            | **Artifact version** | `${{ needs.version.outputs.artifact_version }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Editions** | 1 minimal · 2 developer · 3 cloud-native · 4 full |
            | **Runner** | GitHub-hosted `ubuntu-24.04` |

            Assets: ISO · WSL tarball · OVF · Vagrant `.box` · MANIFEST · SHA256SUMS.

            > **These nightly assets are MOCK artifacts (not bootable)** when any MANIFEST says `mock=yes`.
            > A real, boot-tested ISO is produced by the "Real ISO build + boot" workflow.
            > Verify provenance: `gh attestation verify <file> -R ${{ github.repository }}`
            > Stable releases: push a `vX.Y.Z` tag or run **Release** workflow.

            ```bash
            make release-check
            ```
          files: release-assets/*
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
