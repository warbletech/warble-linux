name: Package

# Minimal edition only. Build the WSL rootfs in an Arch container, test it
# with scripts/test.sh wsl on the warble-ci runner, then push the imported
# image to GHCR. No mock GitHub Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: warble-linux-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: minimal WSL rootfs
    runs-on: warble-ci
    timeout-minutes: 90
    container:
      image: archlinux:base-20261018.0.612668
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build edition 1
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x scripts/*.sh
          scripts/build.sh deps
          VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="$VERSION" scripts/build.sh images 1
          ls -lh out/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wsl-minimal
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  test:
    name: WSL and container smoke
    needs: build
    runs-on: warble-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wsl-minimal
          path: out
      - name: test.sh wsl
        run: |
          chmod +x scripts/test.sh
          scripts/test.sh wsl "$(ls out/warble-linux-wsl2-*.tar.gz)"

  publish:
    name: GHCR
    needs: test
    runs-on: warble-ci
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wsl-minimal
          path: out
      - name: Push ghcr.io image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tar=$(ls out/warble-linux-wsl2-*.tar.gz)
          ver=$(basename "$tar" | sed -n 's/.*-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
          test -n "$ver"
          img="ghcr.io/warbletech/warble-linux"
          docker import "$tar" "$img:$ver"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$img:$ver" "$img:0"
          docker push "$img:$ver"
          docker push "$img:0"
