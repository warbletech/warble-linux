#
# Minimal pacman.conf for archiso builds (real mkarchiso host).
# Not used on Ubuntu mock CI path.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Size: VM sandboxes don't need docs, man pages, info pages or translations.
# (Kept: usr/share/locale/locale.alias, i18n data, X11 locale/compose files.)
NoExtract   = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*
NoExtract   = usr/share/help/* usr/share/locale/* !usr/share/locale/locale.alias

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
