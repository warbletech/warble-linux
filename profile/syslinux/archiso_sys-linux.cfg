LABEL arch
TEXT HELP
Boot the Warble Linux live sandbox on BIOS.
Ephemeral sandbox for testing, learning, and cloud-native workflows.
ENDTEXT
MENU LABEL Warble Linux live sandbox (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Warble Linux live sandbox on BIOS with speakup screen reader.
Ephemeral sandbox with speech feedback for accessibility.
ENDTEXT
MENU LABEL Warble Linux live sandbox (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=ttyS0,115200 console=tty0 accessibility=on
