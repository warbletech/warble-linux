#!/usr/sbin/nft -f
# Warble Linux live sandbox firewall
#
# Intent: nothing on the network can reach into the sandbox, but the sandbox
# itself can reach the network (package installs, git, container pulls).
#   inbound : deny by default; allow loopback, replies to our own traffic,
#             DHCP client replies, and the ICMP/ICMPv6 needed for a working
#             network (IPv6 neighbour discovery, PMTU, ping replies)
#   forward : deny by default; allow replies and container bridges (Docker)
#   outbound: allow
# For a fully offline sandbox, see docs/architecture.md ("Offline mode").

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state { established, related } accept

        # DHCPv4 / DHCPv6 client replies
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # ICMP needed for a functioning network (no inbound services)
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state { established, related } accept
        # Container bridges created by Docker (cloud-native / full editions)
        iifname { "docker0", "br-*" } accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
