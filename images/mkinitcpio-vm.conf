# Generic VM initramfs: no autodetect (build host != target VM).
# virtio (QEMU/KVM/libvirt), AHCI/PIIX (VirtualBox, VMware), Hyper-V storage.
MODULES=(virtio_pci virtio_blk virtio_scsi virtio_net ahci ata_piix sd_mod hv_storvsc ext4 vfat)
HOOKS=(base udev modconf kms keyboard block filesystems fsck)
COMPRESSION="zstd"
